name: Build ITN National APK & AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual one-click trigger from GitHub website

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Debug APK (For Direct TV & Mobile Testing)
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release AAB (For Google Play Store)
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload Debug APK as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ITN-National-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release AAB as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ITN-National-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
